# page-directoryd.conf -- control-plane node 1, one of a 3-node Raft
# quorum (ARCH-002 §05). `peer` lines are identical across all 3 nodes'
# copies of this file; only node_id and client_listen_port differ.
node_id 1
peer 1 10.0.0.11 7101
peer 2 10.0.0.12 7101
peer 3 10.0.0.13 7101
client_listen_port 7111
