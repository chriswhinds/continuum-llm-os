# schedulerd.conf -- control-plane node 1. api-gatewayd (same node)
# reaches this over the Unix socket below; each `route` reaches a compute
# node's shard-execd over TCP, since that's a different physical board
# (ARCH-002 §01) -- see scheduler_config.h's module comment.
listen_unix_socket /run/continuum/schedulerd.sock
route toy-model 10.0.0.21:7301
