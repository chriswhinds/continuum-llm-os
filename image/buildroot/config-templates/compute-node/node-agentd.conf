# node-agentd.conf -- compute node 11 (ARCH-002 §05).
node_id 11
listen_port 7201
page_size 2097152
health_interval_ms 2000
# consoled (ARCH-001 §10) runs as a single instance in this reference
# build -- node-agentd's fan-out to multiple sinks is supported (add more
# telemetry_sink lines), but only one consoled has been run/tested at a
# time; treat multi-instance HA as untested, not unsupported.
telemetry_sink 10.0.0.11:7401
