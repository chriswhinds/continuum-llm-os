# shard-execd.conf -- compute node 11 (ARCH-002 §05).
node_id 11
weight_file /var/lib/continuum/shard-11.weights
page_size 2097152
swapd_unix_socket /run/continuum/swapd.sock
listen_port 7301
default_max_new_tokens 256
default_temperature 0.8
