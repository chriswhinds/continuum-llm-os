# membershipd.conf -- control-plane node 1. Its own Raft group, on
# different ports from page-directoryd's (ARCH-002 §05: kept separate so
# a directory snapshot/compaction pause can never risk quorum stability).
node_id 1
peer 1 10.0.0.11 7102
peer 2 10.0.0.12 7102
peer 3 10.0.0.13 7102
client_listen_port 7112
