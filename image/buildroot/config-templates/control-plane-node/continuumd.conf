# continuumd.conf -- control-plane node (ARCH-002 §01/§04). Example node_id 1.
uart_device /dev/ttyS0
heartbeat_interval_ms 2000

service page-directoryd /opt/continuum/bin/page-directoryd --config /etc/continuum/page-directoryd.conf
service membershipd     /opt/continuum/bin/membershipd     --config /etc/continuum/membershipd.conf
service schedulerd      /opt/continuum/bin/schedulerd      --config /etc/continuum/schedulerd.conf
service api-gatewayd    /opt/continuum/bin/api-gatewayd    --config /etc/continuum/api-gatewayd.conf
service consoled        /opt/continuum/bin/consoled        --config /etc/continuum/consoled.conf
