# swapd.conf -- compute node 11's paging engine (ARCH-002 §05).
node_id 11
weight_file /var/lib/continuum/shard-11.weights
# Sized for this node's assigned pipeline stage -- see the shard manifest
# used at model-load time (ARCH-001 §06). Must be a multiple of page_size.
tensor_region_bytes 4294967296
page_size 2097152
# The node's actual DRAM budget for this shard, independent of and
# normally smaller than tensor_region_bytes -- this is what makes swap
# happen at all (see swapd_config.h). Example: 8GB / 2MB pages.
dram_capacity_pages 4096
unix_socket /run/continuum/swapd.sock
high_watermark_pct 85
